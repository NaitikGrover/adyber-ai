<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adyber Sign In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0b0b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #141414;
      border: 1px solid #242424;
      border-radius: 24px;
      padding: 48px 40px;
      width: 360px;
      text-align: center;
      box-shadow: 0 32px 64px rgba(0,0,0,0.6);
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { color: #888888; font-size: 14px; margin-bottom: 32px; line-height: 1.5; }
    .btn {
      width: 100%;
      background: #ffffff;
      color: #111111;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.15s;
    }
    .btn:hover { background: #f0f0f0; }
    .status { margin-top: 20px; font-size: 14px; color: #888888; min-height: 20px; }
    .success { color: #22c55e !important; font-weight: 600; }
    .error { color: #ef4444 !important; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>Sign in to Adyber</h1>
    <p id="desc">Connect your Google account to finish setting up your desktop AI assistant.</p>

    <button class="btn" id="signInBtn" onclick="doSignIn()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </button>

    <div class="status" id="status"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYoCfxpCxOpJL5hTwHN-hNhV2VX6X_wG4",
      authDomain: "adyber-d615d.firebaseapp.com",
      projectId: "adyber-d615d",
      storageBucket: "adyber-d615d.firebasestorage.app",
      messagingSenderId: "141683115767",
      appId: "1:141683115767:web:cb52c06b591a06baef75f2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    const signInBtn = document.getElementById('signInBtn');
    const status = document.getElementById('status');
    const desc = document.getElementById('desc');
    const urlParams = new URLSearchParams(window.location.search);
    const authState = urlParams.get('state');

    window.doSignIn = async function() {
      signInBtn.disabled = true;
      signInBtn.innerHTML = '<span style="color:#888">Signing in...</span>';
      status.textContent = '';
      status.className = 'status';

      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        // Read user document from Firestore right here while 100% authenticated
        let cloudData = null;
        try {
          const docRef = doc(db, "users", user.uid);
          const docSnap = await getDoc(docRef);
          if (docSnap.exists()) {
            cloudData = docSnap.data();
            console.log("[auth.html] Loaded existing user cloudData:", cloudData);
          }
        } catch(e) {
          console.error("[auth.html] Firestore read error:", e);
        }

        const userData = {
          uid: user.uid,
          name: user.displayName || '',
          email: user.email || '',
          photoURL: user.photoURL || '',
          cloudData: cloudData,
          state: authState
        };

        // 1. Trigger custom protocol deep link to wake up Electron app directly from HTTPS
        let deepLinkUrl = '#';
        try {
          const userJson = JSON.stringify(userData);
          const b64Data = btoa(unescape(encodeURIComponent(userJson)));
          deepLinkUrl = `adyber://callback?user=${encodeURIComponent(b64Data)}`;
          window.location.href = deepLinkUrl;
        } catch(deepErr) {
          console.error("Deep link redirect failed:", deepErr);
        }

        // 2. Secondary POST back to local Electron server as fallback
        fetch('http://localhost:54321/callback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(userData)
        }).catch(() => {});

        // 2. Write user basic info to Firestore 'users' collection
        setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          name: user.displayName || '',
          email: user.email || '',
          photoURL: user.photoURL || '',
          updatedAt: serverTimestamp()
        }, { merge: true }).catch(dbErr => console.error("Firestore save error:", dbErr));

        // 3. Render Success UI in browser with explicit button to trigger/re-trigger deep link
        document.body.innerHTML = `
          <div style="background:#0b0b0b;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;height:100vh;width:100vw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
            <div style="background:#141414;border:1px solid #242424;border-radius:24px;padding:40px;max-width:380px;">
              <h2 style="font-size:22px;color:#22c55e;margin-bottom:10px;">✓ Signed in successfully!</h2>
              <p style="color:#aaa;font-size:14px;margin-bottom:16px;">Welcome, <b>${user.email}</b></p>
              <a href="${deepLinkUrl}" style="display:inline-block;background:#ffffff;color:#111111;padding:12px 24px;border-radius:10px;text-decoration:none;font-weight:600;margin-bottom:16px;font-size:14px;">Open Adyber App</a>
              <p style="color:#666;font-size:13px;">Click the button above if Adyber does not open automatically.</p>
            </div>
          </div>
        `;
      } catch (err) {
        console.error("Sign in error:", err);
        signInBtn.disabled = false;
        signInBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg> Continue with Google`;
        if (err.code !== 'auth/popup-closed-by-user') {
          status.className = 'status error';
          status.textContent = err.message || 'Sign in failed.';
        }
      }
    };
  </script>
</body>
</html>
